<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Integration Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px 15px; margin: 5px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; white-space: pre-wrap; }
        select, input { padding: 5px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Customer Integration Test</h1>
    
    <div class="test-section">
        <h2>1. Load Customers</h2>
        <button onclick="loadCustomers()">Load Customers</button>
        <div id="customer-list" class="result"></div>
        
        <h3>Customer Dropdown:</h3>
        <select id="customer-select">
            <option value="">Select a customer...</option>
        </select>
    </div>
    
    <div class="test-section">
        <h2>2. Create New Customer</h2>
        <input type="text" id="new-customer-name" placeholder="Customer Name" />
        <input type="text" id="new-customer-contact" placeholder="Contact" />
        <input type="text" id="new-customer-location" placeholder="Location" />
        <button onclick="createCustomer()">Create Customer</button>
        <div id="create-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Selected Customer Info</h2>
        <div id="selected-customer" class="result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        let customers = [];

        async function loadCustomers() {
            try {
                const response = await fetch(`${API_BASE}/customer/get/E-customer`);
                const data = await response.json();
                
                if (response.ok) {
                    customers = data.customers || data.rows || [];
                    document.getElementById('customer-list').textContent = JSON.stringify(data, null, 2);
                    
                    // Populate dropdown
                    const select = document.getElementById('customer-select');
                    select.innerHTML = '<option value="">Select a customer...</option>';
                    customers.forEach(customer => {
                        const option = document.createElement('option');
                        option.value = customer.id;
                        option.textContent = `${customer.name} (${customer.contact})`;
                        select.appendChild(option);
                    });
                } else {
                    document.getElementById('customer-list').textContent = `Error: ${response.status} ${response.statusText}`;
                }
            } catch (error) {
                document.getElementById('customer-list').textContent = `Error: ${error.message}`;
            }
        }

        async function createCustomer() {
            const name = document.getElementById('new-customer-name').value;
            const contact = document.getElementById('new-customer-contact').value;
            const location = document.getElementById('new-customer-location').value;
            
            if (!name || !contact || !location) {
                document.getElementById('create-result').textContent = 'Please fill all fields';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/customer/add-new-customer`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, contact, location }),
                });
                
                const result = await response.json();
                document.getElementById('create-result').textContent = JSON.stringify(result, null, 2);
                
                if (response.ok) {
                    // Clear form
                    document.getElementById('new-customer-name').value = '';
                    document.getElementById('new-customer-contact').value = '';
                    document.getElementById('new-customer-location').value = '';
                    
                    // Reload customers
                    loadCustomers();
                }
            } catch (error) {
                document.getElementById('create-result').textContent = `Error: ${error.message}`;
            }
        }

        // Handle customer selection
        document.getElementById('customer-select').addEventListener('change', function(e) {
            const customerId = e.target.value;
            if (customerId) {
                const customer = customers.find(c => c.id == customerId);
                document.getElementById('selected-customer').textContent = JSON.stringify(customer, null, 2);
            } else {
                document.getElementById('selected-customer').textContent = '';
            }
        });

        // Load customers on page load
        window.onload = loadCustomers;
    </script>
</body>
</html>
